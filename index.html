<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>I-CARE Learning Module</title>
<style>
:root{--navy:#14213d;--navy2:#22335c;--cream:#faf5e9;--card:#fffdf7;--gold:#b8913b;--ink:#1d2433;--mute:#5b6478;--ok:#1f7a4d;--bad:#a8322d;--line:#e4dcc6}
*{box-sizing:border-box}body{margin:0;font-family:Georgia,'Times New Roman','Noto Sans JP','Noto Sans KR','Noto Sans Myanmar','Yu Gothic','Malgun Gothic','Myanmar Text',serif;background:var(--cream);color:var(--ink);line-height:1.55}
button,a{font:inherit}h1,h2,h3{font-family:Georgia,serif;color:var(--navy);margin:.2em 0}
header{background:var(--navy);color:#fff;padding:18px 20px;border-bottom:3px solid var(--gold)}
header .in,main{max-width:900px;margin:auto}header .in{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
header h1{color:#fff;font-size:1.3rem;cursor:pointer}header small{color:#e9dcb5}
main{padding:20px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;box-shadow:0 1px 3px rgba(20,33,61,.08)}
.vcard{text-align:left;cursor:pointer;width:100%}.vcard:hover,.vcard:focus-visible{border-color:var(--gold);outline:2px solid var(--gold)}
.letter{display:inline-grid;place-items:center;width:44px;height:44px;border-radius:50%;background:var(--navy);color:var(--gold);font-size:1.5rem;font-weight:700;margin-right:10px}
.th{color:var(--mute);font-size:.9rem}.bar{height:8px;background:var(--line);border-radius:6px;overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;background:var(--gold)}
.btn{background:var(--navy);color:#fff;border:0;border-radius:8px;padding:10px 16px;cursor:pointer;margin:4px 6px 4px 0}.btn:hover{background:var(--navy2)}.btn.alt{background:#fff;color:var(--navy);border:1px solid var(--navy)}
.btn:focus-visible,.opt:focus-visible{outline:3px solid var(--gold)}
.tag{display:inline-block;font-size:.75rem;padding:2px 8px;border-radius:10px;margin-bottom:6px}.off{background:#e6ecf8;color:var(--navy)}.edu{background:#f6ecd0;color:#6b5217}
.opt{display:block;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:8px;padding:12px;margin:8px 0;cursor:pointer}.opt:hover:not(:disabled){border-color:var(--gold)}
.opt.ok{background:#e4f4ea;border-color:var(--ok)}.opt.bad{background:#fbe6e4;border-color:var(--bad)}
.fb{padding:12px;border-radius:8px;margin-top:10px;background:#f1ede0}.fb.ok{border-left:5px solid var(--ok)}.fb.bad{border-left:5px solid var(--bad)}
ul{padding-left:20px}.stats{display:flex;gap:16px;flex-wrap:wrap;color:#fff}.note{font-size:.85rem;color:var(--mute);margin-top:24px}
.badge{display:inline-block;background:var(--gold);color:#fff;border-radius:12px;padding:2px 10px;font-size:.8rem}
select{padding:6px;border-radius:6px;border:1px solid var(--gold)}.letter.s{font-size:.8rem}</style></head><body>
<header><div class="in"><h1 id="home" tabindex="0" role="link">I-CARE Learning Module</h1><div class="stats" id="stats" aria-live="polite"></div></div></header>
<main id="app"></main>

["가상 시나리오. 한 서버가 먼 스테이션에서 테이블마다 따로 물을 채워 와서 고객이 자주 기다린다는 것을 알게 되었습니다. 혁신을 가장 잘 보여 주는 대응은 무엇입니까?",["늘 해 오던 방식이니 그대로 유지한다","담당 구역 가까이에 작은 리필 공간을 두자고 제안하고, 상사의 동의를 얻어 시험해 본다","동료들에게 불평만 하고 아무 제안도 하지 않는다"],"시간과 자원을 아끼는 프로세스 개선이며, 적절한 사람을 통해 시범 적용을 제안함으로써 아이디어를 현실로 만드는 행동입니다."]]),
C:V("I-CARE 개요 포스터 및 고객 포스터","우리는 아끼기 때문에, 고객의 입장에서 생각하고 언제나 고객을 기쁘게 합니다.",

["서비스 실수가 발생한 직후에 해당하는 5단계 중 하나는 무엇입니까?",["고객과 자신이 맡은 제품이나 영역을 잘 안다","실수했을 때는 인정하고 바로잡는다","언제든 서비스할 수 있도록 대기한다"],"이 단계는 실수를 인정한 다음 바로잡으라고 알려 줍니다."],

A:V("I-CARE 개요 포스터 및 제휴(Alliance) 포스터","우리는 아끼기 때문에, 그룹 전체의 이익을 위해 다양성과 포용적인 팀 정신을 소중히 여깁니다.",

R:V("I-CARE 개요 포스터 및 관계 포스터","우리는 아끼기 때문에, 지속 가능한 미래를 위해 직원, 파트너, 사회와 함께합니다.",

 if(!tr.qs||tr.qs.length!==v.qs.length||tr.qs.some((q,i)=>!q.q||!q.w||!q.o||q.o.length!==v.qs[i].o.length||!q.o.every(Boolean)))out.push(id+".qs");if(v.id!=="CoC"&&tr.official&&tr.official.some((s,i)=>v.official[i]&&s.items.some((x,j)=>x===v.official[i].items[j])))out.push(id+".official.english");if(tr.examples&&tr.examples.some((x,i)=>x===v.examples[i]))out.push(id+".examples.english");if(tr.qs&&tr.qs.some((q,i)=>v.qs[i]&&(q.q===v.qs[i].q||(q.o||[]).some((o,j)=>o===v.qs[i].o[j]))))out.push(id+".qs.english")}}return out}

let S=(()=>{try{return JSON.parse(localStorage.getItem(KEY))||{pts:0,got:{},best:{}}}catch(e){return{pts:0,got:{},best:{}}}})();
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
VALUES.forEach(v=>{v.qs=v.qs.filter((q,i)=>{const ok=q.o&&q.o.length>=2&&Number.isInteger(q.a)&&q.a>=0&&q.a<q.o.length&&q.w;if(!ok)console.warn("Invalid question skipped",v.id,i);return ok})});
const app=document.getElementById("app");let P=null,cur=home;
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const level=()=>Math.floor(S.pts/50)+1;
const pct=v=>S.best[v.id]===undefined?0:Math.round(100*S.best[v.id]/v.qs.length);
function boot(){document.documentElement.lang=lang;document.title=t("title");document.getElementById("home").textContent=t("title")}
function setLang(k){lang=k;try{localStorage.setItem("icare-lang",k)}catch(e){}boot();cur()}
function stats(){const sel=(!P||P.done)?`<select id="lg" aria-label="Language">${Object.keys(LANGS).map(k=>`<option value="${k}"${k===lang?" selected":""}>${LANGS[k]}</option>`).join("")}</select>`:"";
 document.getElementById("stats").innerHTML=`<span>${t("lv")} ${level()}</span><span>${S.pts} ${t("pt")}</span>${sel}`;
 const e=document.getElementById("lg");if(e)e.onchange=()=>setLang(e.value)}
function home(){P=null;cur=home;stats();const done=VALUES.filter(v=>S.best[v.id]!==undefined).length;
 app.innerHTML=`<h2>${t("ex")}</h2>${lang!=="en"?`<p class="th">${t("en")}</p>`:""}<p>${done}/${VALUES.length} ${t("att")}</p>
 <div class="bar"><i style="width:${100*done/VALUES.length}%"></i></div><div class="grid">${VALUES.map(w=>{const v=lc(w);return `<button class="card vcard" data-v="${v.id}"><span class="letter${v.sym?' s':''}">${v.sym||v.id}</span><b>${nm(v)}</b><div class="th">${v.th}</div><p>${v.line}</p><div class="bar"><i style="width:${pct(v)}%"></i></div>${(S.best[v.id]>=2)?`<span class="badge">${t("bd")}</span>`:`<small>${t("hint")}</small>`}</button>`}).join("")}</div>
 <p class="note">${t("note")}</p><button class="btn alt" id="reset">${t("rs")}</button>`;
 app.querySelectorAll("[data-v]").forEach(b=>b.onclick=()=>learn(b.dataset.v));
 document.getElementById("reset").onclick=()=>{if(confirm(t("rq"))){S={pts:0,got:{},best:{}};save();home()}}}
function learn(id){const v=lc(VALUES.find(x=>x.id==id));P=null;cur=()=>learn(id);stats();
 app.innerHTML=`<button class="btn alt" id="back">${t("bk")}</button>
 <h2><span class="letter${v.sym?' s':''}">${v.sym||v.id}</span>${nm(v)} <span class="th">${v.th}</span></h2>${(lang!=="en"&&v.miss)?`<p class="th">${t("en")}</p>`:""}
 <div class="card">${v.miss?'<span class="tag edu">EN</span> ':''}<span class="tag off">${v.miss||lang==="en"?t("of"):t("ofx")}</span><p><b>${v.line}</b></p>
 ${v.official.map(s=>`<h3>${s.h}</h3><ul>${s.items.map(i=>`<li>${i}</li>`).join("")}</ul>`).join("")}<small class="th">${v.src}</small></div>
 <div class="card" style="margin-top:14px"><span class="tag edu">${t("ed")}</span><ul>${v.examples.map(e=>`<li>${e}</li>`).join("")}</ul></div>
 <p><button class="btn" id="go">${t("st")} (${v.qs.length})</button></p>`;
 document.getElementById("back").onclick=home;document.getElementById("go").onclick=()=>start(v)}
function start(v){P={v,i:0,score:0,streak:0,missed:[],sel:null};stats();ask()}
function ask(){const{v,i}=P,q=v.qs[i];P.order=shuf(q.o.map((_,k)=>k));P.sel=null;
 app.innerHTML=`<p>${v.miss?"[EN] ":""}${nm(v)} · ${t("qn")} ${i+1}/${v.qs.length}</p><div class="bar"><i style="width:${100*i/v.qs.length}%"></i></div>
 <div class="card">${q.sc?`<span class="tag edu">${t("sc")}</span>`:`<span class="tag off">${t("kc")}</span>`}<h3>${q.q}</h3>
 <div role="group">${P.order.map(k=>`<button class="opt" data-k="${k}">${q.o[k]}</button>`).join("")}</div><div id="fb" aria-live="polite"></div></div>`;
 app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>pick(+b.dataset.k))}
function pick(k){if(P.sel!==null)return;P.sel=k;const{v,i}=P,q=v.qs[i],ok=k===q.a,id=v.id+i;let msg="";
 if(ok){P.score++;P.streak++;let g=0;if(!S.got[id]){g=10+(P.streak>=3?5:0);S.got[id]=1;S.pts+=g}msg=t("ok")+(g?`. +${g} ${t("pt")}${P.streak>=3?` (${t("sb")})`:""}`:"")}
 else{P.streak=0;P.missed.push(i);msg=t("no")}
 app.querySelectorAll(".opt").forEach(b=>{b.disabled=true;const n=+b.dataset.k;if(n===q.a)b.classList.add("ok");else if(n===k)b.classList.add("bad")});
 document.getElementById("fb").innerHTML=`<div class="fb ${ok?"ok":"bad"}"><b>${msg}</b><p>${q.w}</p><button class="btn" id="nx">${i+1<v.qs.length?t("nx"):t("sr")}</button></div>`;
 save();document.getElementById("nx").onclick=()=>{P.i++;P.i<v.qs.length?ask():finish()};document.getElementById("nx").focus()}
function finish(){const{score,missed}=P;const v=lc(VALUES.find(x=>x.id===P.v.id));P.done=true;cur=finish;S.best[v.id]=Math.max(S.best[v.id]??0,score);save();stats();
 app.innerHTML=`<div class="card"><h2>${t("res").replace("{n}",nm(v))}</h2><p><b>${t("sc2").replace("{a}",score).replace("{b}",v.qs.length)}</b> · ${S.pts} ${t("pt")} · ${t("lv")} ${level()}</p>
 ${score>=2?`<p><span class="badge">${t("bd")}</span></p>`:""}
 ${missed.length?`<h3>${t("rv")}</h3><ul>${missed.map(m=>`<li>${v.qs[m].q}<br><small>${t("ca")} ${v.qs[m].o[v.qs[m].a]}</small></li>`).join("")}</ul>`:""}
 <button class="btn" id="rp">${t("rp")}</button><button class="btn alt" id="rd">${t("rr")}</button><button class="btn alt" id="hm">${t("all")}</button></div>`;
 document.getElementById("rp").onclick=()=>start(v);document.getElementById("rd").onclick=()=>learn(v.id);document.getElementById("hm").onclick=home}
const h=document.getElementById("home");h.onclick=home;h.onkeydown=e=>{if(e.key==="Enter")home()};
boot();home();{const pr=DBG?checkTR():[];if(pr.length)console.warn("Translation incomplete ("+pr.length+")",pr)}
</script></body></html>
